blueprint:
  name: FRITZ!Box call list on a 400x300 display
  description: >-
    Draws the five most recent calls on a 400x300 OpenDisplay tag, laid out for
    a black/white/red/yellow panel: missed calls in red with a red edge marker,
    phonebook VIP contacts marked in yellow, and a yellow SPAM badge when
    tellows scored the caller 6 or higher.

    Needs the call history sensor from the fritzbox_callmonitor custom
    integration -- the one whose state is a timestamp and that carries a `calls`
    attribute.
  domain: automation
  author: g4bri3lDev
  source_url: https://github.com/g4bri3lDev/ha-fritzbox-callmonitor/blob/main/blueprints/automation/fritzbox_callmonitor/call_list_400x300.yaml

  input:
    call_history:
      name: Call history sensor
      description: The `... Call history ...` sensor of your FRITZ!Box.
      selector:
        entity:
          filter:
            - integration: fritzbox_callmonitor
              domain: sensor
    displays:
      name: Displays
      description: One or more 400x300 OpenDisplay tags to draw on.
      selector:
        device:
          filter:
            - integration: opendisplay
          multiple: true

mode: single
max_exceeded: silent

variables:
  call_history: !input call_history
  calls: "{{ state_attr(call_history, 'calls') or [] }}"
  missed: "{{ state_attr(call_history, 'missed_calls') or 0 }}"

triggers:
  # The sensor's state is the timestamp of the newest call, so it changes
  # exactly once per call.
  - trigger: state
    entity_id: !input call_history
  - trigger: homeassistant
    event: start
  # Once a day, just after midnight. The only thing that goes stale without a
  # call is the relative dating -- last night's call has to stop saying "23:50"
  # and start saying "Gestern". Redrawing more often than that would spend the
  # tag's battery on a panel refresh that changes nothing.
  - trigger: time
    at: "00:01:00"

conditions:
  - condition: template
    value_template: "{{ has_value(call_history) or states(call_history) == 'unknown' }}"

actions:
  - action: opendisplay.drawcustom
    target:
      device_id: !input displays
    data:
      background: white
      rotate: 0
      payload: >
        [
          {"type": "rectangle", "x_start": 0, "y_start": 0, "x_end": 400, "y_end": 42, "fill": "black"}
          ,{"type": "icon", "value": "mdi:phone-log", "x": 14, "y": 21, "size": 24, "color": "white", "anchor": "lm"}
          ,{"type": "text", "value": "Anrufe", "x": 46, "y": 21, "size": 24, "color": "white", "anchor": "lm"}
          {# Not red: the panel's red ink is a dark maroon and only reaches 1.45:1
             against the black bar, so it all but disappears. Yellow manages 5.57:1
             and still reads as an alert; white is the plain state. Red keeps its
             meaning in the rows below, where it sits on white at 6.4:1. #}
          {% set alert = 'yellow' if missed else 'white' %}
          ,{"type": "icon", "value": "mdi:phone-missed", "x": 262, "y": 21, "size": 18, "color": "{{ alert }}", "anchor": "lm"}
          ,{"type": "text", "value": "{{ missed }}", "x": 286, "y": 21, "size": 20, "color": "{{ alert }}", "anchor": "lm"}
          {# Today's date, not a clock: the frame is only redrawn daily or on a call,
             so a clock would sit there lying. The date doubles as a staleness
             check -- if it is not today, the display or the integration is stuck. #}
          ,{"type": "text", "value": "{{ now().strftime('%d.%m.') }}", "x": 386, "y": 21, "size": 15, "color": "white", "anchor": "rm"}

          {% set today = now().strftime('%Y-%m-%d') %}
          {% set yesterday = (now() - timedelta(days=1)).strftime('%Y-%m-%d') %}

          {% for call in calls[:5] %}
          {% set top = 48 + loop.index0 * 50 %}
          {% set mid = top + 22 %}
          {% set tone = 'red' if call.type == 'missed' else 'black' %}
          {% set spam = call.spam_score and call.spam_score >= 6 %}
          {# Truncation is by pixel width, so a long name can never run into the date. #}
          {% set name_width = 238 if spam else 266 %}
          {% set stamp = as_timestamp(call.timestamp) %}
          {% set day = stamp | timestamp_custom('%Y-%m-%d') %}

          {% if not loop.first %}
          {# A hairline must be a solid palette colour. "ltgray" does not exist on a
             BWRY panel, so it gets error-diffusion dithered, and a 1px line has no
             area for the pattern to read as grey: only a tenth of it survives. #}
          ,{"type": "line", "x_start": 18, "x_end": 386, "y_start": {{ top - 4 }}, "fill": "black"}
          {% endif %}

          {% if call.type == 'missed' %}
          ,{"type": "rectangle", "x_start": 0, "y_start": {{ top }}, "x_end": 6, "y_end": {{ top + 44 }}, "fill": "red", "outline": "red"}
          {% elif call.vip %}
          ,{"type": "rectangle", "x_start": 0, "y_start": {{ top }}, "x_end": 6, "y_end": {{ top + 44 }}, "fill": "yellow", "outline": "yellow"}
          {% endif %}

          ,{"type": "icon", "value": "{{ call.icon }}", "x": 18, "y": {{ mid }}, "size": 22, "color": "{{ tone }}", "anchor": "lm"}
          ,{"type": "text", "value": "{{ call.name or call.number }}", "x": 48, "y": {{ mid - 9 }}, "size": 19, "color": "{{ tone }}", "anchor": "lm", "max_width": {{ name_width }}, "truncate": True}
          {# A withheld caller has no number at all: the box leaves it empty and
             puts its own placeholder in the name, so printing the number here
             would leave a blank line. Seen on 3 of 16 real calls.

             With no name there is nothing to put here either: the number is
             already the line above, so a second line would only restate it. #}
          {% if call.number and call.name %}
          ,{"type": "text", "value": "{{ call.number }}", "x": 48, "y": {{ mid + 12 }}, "size": 14, "color": "gray", "anchor": "lm", "max_width": 266, "truncate": True}
          {% elif not call.number %}
          ,{"type": "text", "value": "Nummer unterdrückt", "x": 48, "y": {{ mid + 12 }}, "size": 14, "color": "gray", "anchor": "lm"}
          {% endif %}

          {% if spam %}
          ,{"type": "rectangle", "x_start": 296, "y_start": {{ mid - 19 }}, "x_end": 340, "y_end": {{ mid - 1 }}, "fill": "yellow", "outline": "yellow", "corners": "all", "radius": 4}
          ,{"type": "text", "value": "SPAM", "x": 318, "y": {{ mid - 10 }}, "size": 12, "color": "black", "anchor": "mm"}
          {% endif %}

          ,{"type": "text", "value": "{% if day == today %}{{ stamp | timestamp_custom('%H:%M') }}{% elif day == yesterday %}Gestern{% else %}{{ stamp | timestamp_custom('%d.%m.') }}{% endif %}", "x": 386, "y": {{ mid - 9 }}, "size": 17, "anchor": "rm"}
          {# Duration underneath the date. A missed call has none, so the slot shows
             the clock time instead -- otherwise an older missed call would show a
             date with no indication of when it actually rang. #}
          ,{"type": "text", "value": "{% if call.duration %}{{ call.duration // 60 }}:{{ '%02d' | format(call.duration % 60) }}{% elif day != today %}{{ stamp | timestamp_custom('%H:%M') }}{% else %}—{% endif %}", "x": 386, "y": {{ mid + 12 }}, "size": 14, "color": "gray", "anchor": "rm"}
          {% endfor %}

          {% if not calls %}
          ,{"type": "icon", "value": "mdi:phone-off", "x": "50%", "y": 150, "size": 40, "color": "gray", "anchor": "mm"}
          ,{"type": "text", "value": "Keine Anrufe", "x": "50%", "y": 196, "size": 20, "color": "gray", "anchor": "mm"}
          {% endif %}
        ]
